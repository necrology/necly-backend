name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built image to GHCR and record its digest
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Run the suite outside UTC so timezone-dependent response bugs (for example
  # a replay body serialized with a +07:00 offset) fail CI instead of passing.
  TZ: Asia/Jakarta

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go format, vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            echo "gofmt required"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  sql-integration:
    name: Disposable PostgreSQL 16 schema and SQL gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: necly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d necly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema twice and reject development seed rows
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: necly_ci
        run: bash scripts/ci/verify-schema.sh
      - name: Backend tests against the CI database configuration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: necly_ci
          DB_SSL_MODE: disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_REQUIRED: "false"
          JWT_SECRET: ci-only-not-a-production-secret-32-bytes
          CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          PAYMENT_PROVIDER: mock
          PAYMENT_SANDBOX: "true"
          APP_ENV: test
        run: go test ./... -count=1

  image:
    name: Immutable image and provenance
    needs: [verify, sql-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=necly-backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=sha-${{ env.SOURCE_SHA }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_SHA }}
      - name: Login to GHCR (push events only)
        if: github.event_name == 'push' || github.event.inputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event.inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record build provenance
        run: |
          {
            echo "### Backend image provenance"
            echo ""
            echo "- source_sha: \`${{ env.SOURCE_SHA }}\`"
            echo "- image_digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- image_ref: \`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`"
            echo "- lockfile: \`go.mod\` / \`go.sum\`"
            echo "- build_args: none"
            echo "- base images: \`golang:1.26-alpine\`, \`alpine:3.20\` from the Dockerfile"
          } >> "$GITHUB_STEP_SUMMARY"
