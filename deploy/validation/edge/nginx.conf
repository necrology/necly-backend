server {
    listen 80;
    server_name validation.localhost api.validation.localhost;

    # Validation-only redirect target. Production must use the normal 443
    # origin and must be changed through the reviewed W11 edge runbook.
    return 301 https://$host:58443$request_uri;
}

server {
    listen 443 ssl;
    server_name validation.localhost;

    ssl_certificate     /etc/nginx/certs/validation.crt;
    ssl_certificate_key /etc/nginx/certs/validation.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/v1/ {
        # Same-origin browser API path. The storefront and this proxy share the
        # https://validation.localhost:58443 origin, so auth cookies stay
        # first-party (SameSite=Lax) and no CORS or mixed-content exemption is
        # required. Scope this to /api/v1/ so Next.js Route Handlers such as
        # /api/auth/forgot-password keep being served by the frontend.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name api.validation.localhost;

    ssl_certificate     /etc/nginx/certs/validation.crt;
    ssl_certificate_key /etc/nginx/certs/validation.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
