# W1 isolated validation environment.
#
# This stack is deliberately separate from the production `necly` project:
#   * project name  : necly-validation
#   * network       : internal-only (no provider or internet egress at runtime)
#   * volumes       : necly-validation_* only
#   * host ports    : 55432, 56379, 58080, 53000, 58088, 58443, 55433, 58081
#   * secrets       : generated into deploy/validation/.runtime.env (gitignored)
#
# It must never be started with a production env file, production volume or
# production database. See README.md for the operating contract.
name: necly-validation

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-api-common: &api-common
  build:
    context: ../..
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: necly-backend
      org.opencontainers.image.source: https://github.com/necrology/necly-backend
      org.opencontainers.image.revision: ${SOURCE_SHA:-unknown}
      org.opencontainers.image.created: ${BUILD_CREATED:-unknown}
      com.necly.environment: validation
  image: ${API_IMAGE:-necly-validation-api:local}
  labels:
    org.opencontainers.image.title: necly-backend
    org.opencontainers.image.source: https://github.com/necrology/necly-backend
    org.opencontainers.image.revision: ${SOURCE_SHA:-unknown}
    org.opencontainers.image.created: ${BUILD_CREATED:-unknown}
    com.necly.environment: validation
  environment:
    APP_ENV: development
    APP_PORT: "8080"
    APP_BASE_URL: http://api.validation.localhost:58080
    FRONTEND_BASE_URL: http://validation.localhost:53000
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: "5432"
    DB_USER: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    DB_NAME: ${POSTGRES_DB}
    DB_SSL_MODE: disable
    REDIS_ADDR: redis:6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_DB: "0"
    REDIS_REQUIRED: "true"
    JWT_SECRET: ${JWT_SECRET}
    JWT_ISSUER: necly-validation
    JWT_ACCESS_TTL: 15m
    JWT_REFRESH_TTL: 168h
    JWT_VERIFICATION_TTL: 24h
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
    COOKIE_SECURE: "false"
    COOKIE_HTTP_ONLY: "true"
    COOKIE_SAME_SITE: Lax
    COOKIE_PATH: /api/v1/auth
    CORS_ALLOWED_ORIGINS: http://127.0.0.1:53000,http://localhost:53000,http://validation.localhost:53000,https://validation.localhost:58443
    CORS_ALLOW_CREDENTIALS: "true"
    RATE_LIMIT_RPM: "600"
    RATE_LIMIT_BURST: "100"
    LOGIN_RATE_LIMIT_RPM: "100"
    REGISTER_RATE_LIMIT_RPH: "100"
    PAYMENT_PROVIDER: mock
    PAYMENT_SANDBOX: "true"
    HTTP_CLIENT_TIMEOUT: 2s
    SMTP_HOST: ""
    REPORT_ADMIN_EMAIL: ""
    TZ: UTC
  logging: *default-logging
  restart: "no"
  networks:
    - validation
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - validation_postgres_data:/var/lib/postgresql/data
      - ./sql:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: "no"
    networks:
      - validation
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256

  postgres-restore:
    image: postgres:16-alpine
    profiles: ["restore"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - validation_restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: "no"
    networks:
      - validation
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - validation_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: "no"
    networks:
      - validation
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  migrate:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      VALIDATION_SEED: ${VALIDATION_SEED:-1}
    volumes:
      - ../../migrations:/migrations:ro
      - ./scripts:/scripts:ro
      - ./migration-checksums.sha256:/checksums.sha256:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    logging: *default-logging
    restart: "no"
    networks:
      - validation

  api:
    <<: *api-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-restore:
    <<: *api-common
    profiles: ["restore"]
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      APP_BASE_URL: http://api.validation.localhost:58081
      FRONTEND_BASE_URL: http://validation.localhost:53000
      DB_HOST: postgres-restore
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSL_MODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: necly-validation-restore
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      JWT_VERIFICATION_TTL: 24h
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      COOKIE_SECURE: "false"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: Lax
      COOKIE_PATH: /api/v1/auth
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:53000,http://localhost:53000
      CORS_ALLOW_CREDENTIALS: "true"
      RATE_LIMIT_RPM: "600"
      RATE_LIMIT_BURST: "100"
      LOGIN_RATE_LIMIT_RPM: "100"
      REGISTER_RATE_LIMIT_RPH: "100"
      PAYMENT_PROVIDER: mock
      PAYMENT_SANDBOX: "true"
      HTTP_CLIENT_TIMEOUT: 2s
      SMTP_HOST: ""
      REPORT_ADMIN_EMAIL: ""
      TZ: UTC
    depends_on:
      postgres-restore:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../../necly-frontend}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:58080/api/v1
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:53000
        NEXT_PUBLIC_DEMO_MODE: "false"
      labels:
        org.opencontainers.image.title: necly-frontend
        org.opencontainers.image.source: https://github.com/necrology/necly-frontend
        org.opencontainers.image.revision: ${FRONTEND_SOURCE_SHA:-unknown}
        org.opencontainers.image.created: ${BUILD_CREATED:-unknown}
        com.necly.environment: validation
    image: ${FRONTEND_IMAGE:-necly-validation-frontend:local}
    labels:
      org.opencontainers.image.title: necly-frontend
      org.opencontainers.image.source: https://github.com/necrology/necly-frontend
      org.opencontainers.image.revision: ${SOURCE_SHA:-unknown}
      org.opencontainers.image.created: ${BUILD_CREATED:-unknown}
      com.necly.environment: validation
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    restart: "no"
    networks:
      - validation
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${EDGE_HTTP_PORT:-58088}:80"
      - "127.0.0.1:${EDGE_HTTPS_PORT:-58443}:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *default-logging
    restart: "no"
    networks:
      - validation
      - published
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

volumes:
  validation_postgres_data:
    name: necly-validation_postgres_data
  validation_restore_data:
    name: necly-validation_restore_data
  validation_redis_data:
    name: necly-validation_redis_data

networks:
  validation:
    name: necly-validation
    internal: true
  published:
    name: necly-validation-published
