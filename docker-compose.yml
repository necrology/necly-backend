version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: necly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: necly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d necly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: necly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: necly-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: necly-api
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_BASE_URL: http://localhost:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: necly
      DB_SSL_MODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-me-to-a-32-byte-secret-at-least-in-production
      JWT_ISSUER: necly
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      JWT_VERIFICATION_TTL: 24h
      CREDENTIAL_ENCRYPTION_KEY: 
      RATE_LIMIT_RPM: 60
      RATE_LIMIT_BURST: 10
      PAYMENT_PROVIDER: mock
      PAYMENT_SANDBOX: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: